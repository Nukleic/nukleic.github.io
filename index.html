<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- INI SENSOR HP (Biar ukuran web murni 100% di layar HP) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Profil Anak Konstruksi</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding-top: 100px;
    }

    .bungkus-utama {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      padding: 20px; /* Biar ada jarak dari pinggir layar */
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0d6efd;
    }

    .bagian-teks {
      text-align: left;
      max-width: 500px;
    }

    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* --- SIHIR KHUSUS LAYAR HP (Responsive Design) --- */
    @media (max-width: 768px) {
      body {
        padding-top: 40px; /* Jarak atas disesuaikan biar gak terlalu ke atas */
      }
      .bungkus-utama {
        flex-direction: column; /* Ubah formasi jadi atas-bawah */
        gap: 20px; /* Jarak foto dan tulisan dideketin */
      }
      .bagian-teks {
        text-align: center; /* Tulisan dirapikan rata tengah */
      }
      img {
        width: 200px; /* Foto sedikit dikecilin biar pas di HP */
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="bungkus-utama">
    <img src="profil.jpg" alt="Foto Profil">
    
    <div class="bagian-teks">
      <h1>Proyek web portofolio anak konstruksi!</h1>
      <p>Pindah dari ngaduk semen ke ngaduk kode. Gas!</p>
      <a href="https://instagram.com/ranggadwiss" target="_blank">
        <button>Mampir ke Instagram Gua</button>
      </a>
    </div>
  </div>

</body>
</html>
