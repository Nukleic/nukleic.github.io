<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Profil Anak Konstruksi</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding-top: 100px;
    }

    /* Ini yang bikin posisinya ke samping */
    .bungkus-utama {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
    }

    /* Ini yang ngunci foto biar bulat sempurna */
    img {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0d6efd;
    }

    /* Ini yang bikin teks rata kiri */
    .bagian-teks {
      text-align: left;
      max-width: 500px;
    }

    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="bungkus-utama">
    <!-- Pastikan nama foto lu di folder adalah profil.jpg -->
    <img src="profil.jpg" alt="Foto Profil">
    
    <div class="bagian-teks">
      <h1>Proyek web portofolio anak konstruksi!</h1>
      <p>Pindah dari ngaduk semen ke ngaduk kode. Gas!</p>
      <a href="https://instagram.com/ranggadwiss" target="_blank">
        <button>Mampir ke Instagram Gua</button>
      </a>
    </div>
  </div>

</body>
</html>
