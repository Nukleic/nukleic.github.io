<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- INI SENSOR HP (Biar ukuran web murni 100% di layar HP) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Learning Web Development</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding-top: 100px;
    }

    .bungkus-utama {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      padding: 20px; /* Biar ada jarak dari pinggir layar */
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0d6efd;
    }

    .bagian-teks {
      text-align: left;
      max-width: 500px;
    }

    button {
  background-color: #0d6efd;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
}

.bagian-teks a {
  width: 100%;
}

    /* --- SIHIR KHUSUS LAYAR HP (Responsive Design) --- */
    @media (max-width: 768px) {
      body {
        padding-top: 40px; /* Jarak atas disesuaikan biar gak terlalu ke atas */
      }
      .bungkus-utama {
        flex-direction: column; /* Ubah formasi jadi atas-bawah */
        gap: 20px; /* Jarak foto dan tulisan dideketin */
      }
      .bagian-teks {
        display: flex; /* Aktifin sihir Flexbox di bagian teks */
        flex-direction: column; /* Paksa barisnya ke bawah (vertikal) */
        align-items: flex-start; /* Bikin semua tulisan & tombol rata kiri */
        gap: 15px; /* Ini dia jurus pemisahnya! Bikin jarak 15px antar elemen */
        max-width: 500px;
}
      img {
        width: 200px; /* Foto sedikit dikecilin biar pas di HP */
        height: 200px;
      }
    }
    .tombol-wa {
  background-color: #25d366; /* Ini kode warna hijau WhatsApp */
}

.tombol-wa:hover {
  background-color: #20bd5c; /* Hijau agak gelap pas kursor nempel */
}
  </style>
</head>
<body>

  <div class="bungkus-utama">
    <img src="profil.jpg" alt="Foto Profil">
    
    <div class="bagian-teks">
      <h1>Learning HTML, CSS, JavaScript</h1>
      <p>Learning web development with HTML, CSS, and JavaScript</p>
      <a href="https://instagram.com/ranggadwiss" target="_blank">
        <button>Follow Me</button>
      </a>
      <a href="https://wa.me/6281901823292" target="_blank">
        <button class="tombol-wa">My WhatsApp</button>
      </a>
  </div>

</body>
</html>
